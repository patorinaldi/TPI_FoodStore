services:
  db:
    image: postgres:16-alpine
    container_name: foodstore_db
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "5432:5432"
    volumes:
      - foodstore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foodstore_data:
